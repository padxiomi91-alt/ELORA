name: Validate ELORA Cloudflare Worker

on:
  push:
    branches: [main, livekit-migration-spike]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-worker.yml"
  pull_request:
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-worker.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker bundle
        working-directory: cloudflare
        run: npx --yes wrangler@4 deploy --dry-run --outdir=./.worker-build
      - name: Check deployed signaling health
        run: |
          response="$(curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-connrefused https://elora-signaling.padxiomi91.workers.dev/health)"
          echo "$response"
          echo "$response" | grep -F '"status":"ok"'
