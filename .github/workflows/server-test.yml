name: Test ELORA signaling server

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-test.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: server
        run: npm install
      - name: Check JavaScript syntax
        working-directory: server
        run: node --check index.js
      - name: Run signaling protocol test
        working-directory: server
        run: npm test
