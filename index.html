<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELORA</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101522;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  max-width: 440px;
  margin: 55px auto;
  padding: 22px;
}

h1 {
  font-size: 43px;
  letter-spacing: 7px;
}

p { color: #b8c2d8; }

button, input {
  width: 100%;
  padding: 15px;
  margin: 9px 0;
  border: 0;
  border-radius: 9px;
  font-size: 16px;
}

button {
  background: #637cff;
  color: white;
  font-weight: bold;
}

button:active { opacity: .7; }

input {
  background: white;
  color: #111;
}

video {
  width: 100%;
  background: black;
  border-radius: 12px;
  margin-top: 15px;
}

#status {
  margin-top: 20px;
  color: #9db1ff;
  overflow-wrap: anywhere;
}

.hidden { display: none; }
</style>
</head>

<body>

<div class="container">

<h1>ELORA</h1>
<p>Private Live Camera Connection</p>

<button onclick="showCamera()">CAMERA</button>
<button onclick="showViewer()">VIEW</button>

<div id="camera" class="hidden">
<h3>Camera Device</h3>

<p>Your 6-digit connection code:</p>
<h2 id="mycode">Connecting...</h2>

<button onclick="startCamera()">START CAMERA</button>
<button onclick="stopCamera()">STOP CAMERA</button>

<video id="local" autoplay muted playsinline></video>
</div>

<div id="viewer" class="hidden">
<h3>Viewer Device</h3>

<input
id="code"
type="text"
inputmode="numeric"
maxlength="6"
placeholder="Enter 6-digit camera code"
>

<button onclick="connectCamera()">CONNECT</button>
<button onclick="requestStop()">REQUEST STOP</button>

<video id="remote" autoplay playsinline controls></video>
</div>

<p id="status">Welcome to ELORA</p>

</div>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<script>

let peer = null;
let stream = null;
let connections = [];
let calls = [];
let currentRole = "";

const peerOptions = {
  config: {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "stun:stun.cloudflare.com:3478" }
    ],
    iceCandidatePoolSize: 10
  }
};

function status(message) {
  document.getElementById("status").textContent = message;
}

function makeCode() {
  return String(Math.floor(100000 + Math.random() * 900000));
}

function setupPeer(role, requestedCode = null) {

  if (peer) peer.destroy();

  const code = role === "camera"
    ? (requestedCode || makeCode())
    : undefined;

  peer = new Peer(code, peerOptions);

  peer.on("open", id => {

    if (role === "camera") {
      document.getElementById("mycode").textContent = id;
      status("Camera ready. Share this code privately.");
    } else {
      status("Viewer ready. Enter the camera code.");
    }

  });

  peer.on("error", error => {

    if (role === "camera" && error.type === "unavailable-id") {
      status("Code already in use. Creating another code...");
      setupPeer("camera", makeCode());
      return;
    }

    status("Connection error: " + error.type);

  });

  peer.on("disconnected", () => {

    status("Connection interrupted. Reconnecting...");

    if (peer && !peer.destroyed) {
      peer.reconnect();
    }

  });

  if (role === "camera") {

    peer.on("connection", conn => {

      connections.push(conn);

      conn.on("open", () => {

        status("Viewer connected.");

        if (stream) {
          sendVideo(conn.peer);
        }

      });

      conn.on("data", message => {

        if (message === "START_REQUEST") {
          status("Viewer connected. Camera owner controls START.");
        }

        if (message === "STOP") {
          stopCamera();
        }

      });

      conn.on("close", () => {
        connections = connections.filter(c => c !== conn);
      });

    });

  }

  if (role === "viewer") {

    peer.on("call", call => {

      call.answer();

      call.on("stream", remoteStream => {

        const video = document.getElementById("remote");
        video.srcObject = remoteStream;

        video.play().catch(() => {
          status("Tap the video to start playback.");
        });

        status("LIVE - Video connected.");

      });

      call.on("close", () => {

        document.getElementById("remote").srcObject = null;
        status("Video connection closed.");

      });

      call.on("error", () => {
        status("Video connection failed.");
      });

      calls.push(call);

    });

  }

}

function showCamera() {

  currentRole = "camera";

  document.getElementById("camera").classList.remove("hidden");
  document.getElementById("viewer").classList.add("hidden");

  if (!peer || peer.destroyed) {
    setupPeer("camera");
  }

}

function showViewer() {

  currentRole = "viewer";

  document.getElementById("viewer").classList.remove("hidden");
  document.getElementById("camera").classList.add("hidden");

  if (!peer || peer.destroyed) {
    setupPeer("viewer");
  }

}

async function startCamera() {

  if (!peer || !peer.open) {
    status("Please wait for your camera code.");
    return;
  }

  try {

    if (!stream) {

      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" },
        audio: false
      });

    }

    document.getElementById("local").srcObject = stream;

    status("Camera LIVE. Sending video to connected viewers.");

    connections.forEach(conn => {

      if (conn.open) {
        sendVideo(conn.peer);
      }

    });

  } catch (error) {

    status("Camera error: " + error.message);

  }

}

function sendVideo(viewerId) {

  if (!stream || !peer) return;

  calls = calls.filter(call => {

    if (call.peer === viewerId) {
      call.close();
      return false;
    }

    return true;

  });

  const call = peer.call(viewerId, stream);

  if (call) {

    calls.push(call);

    call.on("error", () => {
      status("Unable to send video. Check internet connection.");
    });

  }

}

function stopCamera() {

  if (stream) {

    stream.getTracks().forEach(track => track.stop());
    stream = null;

  }

  calls.forEach(call => call.close());
  calls = [];

  document.getElementById("local").srcObject = null;

  status("Camera stopped.");

}

function connectCamera() {

  const id = document.getElementById("code").value.trim();

  if (!/^\d{6}$/.test(id)) {
    status("Please enter the 6-digit camera code.");
    return;
  }

  if (!peer || !peer.open) {
    status("Please wait until viewer is ready.");
    return;
  }

  const conn = peer.connect(id);

  connections.push(conn);

  conn.on("open", () => {

    conn.send("START_REQUEST");
    status("Connected. Waiting for camera owner to start.");

  });

  conn.on("error", () => {
    status("Could not connect. Check the camera code.");
  });

  conn.on("close", () => {
    status("Camera connection closed.");
  });

}

function requestStop() {

  connections.forEach(conn => {

    if (conn.open) {
      conn.send("STOP");
    }

  });

  status("Stop request sent.");

}

</script>

</body>
</html>
